name: Backend CI/CD (pokedex-server, PM2, self-hosted)

on:
  push:
    branches: [ "main" ]
    paths:
      - "pokedex-server/**"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            pokedex-server/package-lock.json

      - name: Install backend dependencies
        working-directory: pokedex-server
        run: npm ci

      - name: Restart backend with PM2
        working-directory: pokedex-server
        run: |
          pm2 startOrReload ecosystem.config.js
          pm2 save
          pm2 status

      - name: Health check with retries
        run: |
          for i in {1..10}; do
            echo "Health check attempt $i..."
            if curl -f http://127.0.0.1/health > /dev/null 2>&1; then
              echo "Health check OK"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after retries"
          exit 1
