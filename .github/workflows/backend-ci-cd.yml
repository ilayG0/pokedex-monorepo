name: Deploy Backend (self-hosted)

on:
  push:
    branches: ["main"]
    paths:
      - "pokedex-server/**"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: backend-prod
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: self-hosted

    steps:
      - name: Show runner info
        run: |
          echo "Running on self-hosted EC2 backend runner"
          whoami
          pwd
          hostname

      - name: Sync repo on EC2
        run: |
          cd /home/ubuntu/pokedex-monorepo/pokedex-server
          git fetch origin
          git reset --hard origin/main

      - name: Install production dependencies
        run: |
          cd /home/ubuntu/pokedex-monorepo/pokedex-server
          npm ci --omit=dev

      - name: Reload with PM2
        run: |
          cd /home/ubuntu/pokedex-monorepo/pokedex-server
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save
      - name: Print deployed commit
        run: |
          cd /home/ubuntu/pokedex-monorepo/pokedex-server
          echo "Deployed commit: $(git rev-parse --short HEAD)"
          git log -1 --oneline

      - name: Health check with retries
        run: |
          for i in {1..15}; do
            echo "Health check attempt $i..."
            RESP="$(curl -s http://127.0.0.1:3000/health || true)"
            echo "health response: $RESP"

            echo "$RESP" | grep -q '"version":"11"' && echo "Health OK (v11)" && exit 0
            sleep 2
          done
          echo "Health check failed after retries"
          exit 1
